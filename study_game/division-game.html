<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>除法小达人 - 九九除法口诀练习</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes bounceIn { 0% { transform: scale(0); opacity: 0; } 60% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
@keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes rainbow { 0% { color: #ff6b6b; } 20% { color: #ffa502; } 40% { color: #2ed573; } 60% { color: #1e90ff; } 80% { color: #a55eea; } 100% { color: #ff6b6b; } }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
@keyframes confetti-fall { 0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
@keyframes timerFlash { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
@keyframes correctFlash { 0% { box-shadow: 0 0 0 0 rgba(46,213,115,0.6); } 100% { box-shadow: 0 0 30px 10px rgba(46,213,115,0); } }

body {
  font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', sans-serif;
  min-height: 100vh; overflow-x: hidden;
  background: linear-gradient(180deg, #a8e6cf 0%, #dcedc1 40%, #ffd3b6 80%, #ffaaa5 100%);
  position: relative;
}

.scene-bg {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0; overflow: hidden;
}
.deco { position: absolute; font-size: 32px; animation: float 3s ease-in-out infinite; opacity: 0.6; }

.container {
  position: relative; z-index: 1;
  max-width: 600px; margin: 0 auto; padding: 20px;
  min-height: 100vh; display: flex; flex-direction: column; align-items: center;
}

.game-title {
  font-size: 2.4em; font-weight: 900; text-align: center;
  animation: rainbow 3s linear infinite;
  text-shadow: 2px 2px 0 rgba(0,0,0,0.1);
  margin: 10px 0 4px;
}
.game-subtitle { font-size: 1em; color: #666; text-align: center; margin-bottom: 16px; }

.start-screen {
  background: rgba(255,255,255,0.92); border-radius: 24px;
  padding: 40px 30px; text-align: center;
  box-shadow: 0 8px 32px rgba(0,0,0,0.1);
  animation: bounceIn 0.5s ease-out;
  width: 100%;
}
.start-screen h2 { font-size: 1.6em; color: #333; margin-bottom: 12px; }
.start-screen p { font-size: 1.05em; color: #666; margin-bottom: 8px; line-height: 1.7; }

.difficulty-section { margin: 20px 0; }
.difficulty-section label { font-size: 1.1em; font-weight: bold; color: #444; display: block; margin-bottom: 10px; }
.difficulty-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.diff-btn {
  padding: 10px 20px; border: 3px solid #ddd; border-radius: 14px;
  background: #fff; font-size: 1em; cursor: pointer; font-weight: bold;
  transition: all 0.2s;
}
.diff-btn:hover { transform: scale(1.05); }
.diff-btn.selected { border-color: #2ed573; background: #e8f8f0; color: #2ed573; }
.diff-btn.selected::after { content: ' ✓'; }

.start-btn {
  display: inline-block; margin-top: 24px;
  padding: 16px 48px; font-size: 1.4em; font-weight: bold;
  background: linear-gradient(135deg, #ff6b6b, #ffa502);
  color: #fff; border: none; border-radius: 50px;
  cursor: pointer; box-shadow: 0 4px 16px rgba(255,107,107,0.4);
  transition: all 0.2s;
}
.start-btn:hover { transform: scale(1.06); box-shadow: 0 6px 24px rgba(255,107,107,0.5); }

.history-btn {
  display: inline-block; margin-top: 12px;
  padding: 12px 36px; font-size: 1.1em; font-weight: bold;
  background: linear-gradient(135deg, #a55eea, #8854d0);
  color: #fff; border: none; border-radius: 50px;
  cursor: pointer; box-shadow: 0 4px 16px rgba(165,94,234,0.3);
  transition: all 0.2s;
}
.history-btn:hover { transform: scale(1.06); }

.game-area {
  width: 100%; animation: slideUp 0.4s ease-out;
}
.info-bar {
  display: flex; justify-content: space-between; align-items: center;
  background: rgba(255,255,255,0.9); border-radius: 16px;
  padding: 12px 20px; margin-bottom: 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}
.info-item { font-size: 1.1em; font-weight: bold; color: #555; }
.info-item span { color: #ff6b6b; }
.timer { font-size: 1.3em; }

.progress-bar {
  width: 100%; height: 12px; background: rgba(255,255,255,0.6);
  border-radius: 6px; margin-bottom: 20px; overflow: hidden;
}
.progress-fill {
  height: 100%; background: linear-gradient(90deg, #2ed573, #7bed9f);
  border-radius: 6px; transition: width 0.4s ease;
}

.question-card {
  background: rgba(255,255,255,0.95); border-radius: 24px;
  padding: 36px 24px; text-align: center;
  box-shadow: 0 8px 32px rgba(0,0,0,0.08);
  animation: bounceIn 0.4s ease-out;
}
.question-card.shake { animation: shake 0.5s ease; }
.question-num { font-size: 0.95em; color: #aaa; margin-bottom: 8px; }
.question-text {
  font-size: 2.8em; font-weight: 900; color: #333;
  margin: 16px 0 24px; letter-spacing: 2px;
}
.question-text .operator { color: #ff6b6b; }
.question-text .equals { color: #2ed573; }
.question-text .qmark { color: #ffa502; animation: pulse 1s infinite; display: inline-block; }

.answer-input {
  width: 120px; padding: 14px; font-size: 2em; text-align: center;
  border: 4px solid #ddd; border-radius: 16px; outline: none;
  font-weight: bold; color: #333; background: #fafafa;
  transition: border-color 0.2s, background 0.2s;
}
.answer-input:focus { border-color: #1e90ff; background: #fff; }
.answer-input.correct { border-color: #2ed573; background: #e8f8f0; animation: correctFlash 0.5s; }
.answer-input.wrong { border-color: #ff4757; background: #ffe0e0; }

.feedback {
  margin-top: 20px; font-size: 1.3em; font-weight: bold;
  min-height: 40px; transition: all 0.3s;
}
.feedback.correct-fb { color: #2ed573; animation: pop 0.3s; }
.feedback.wrong-fb { color: #ff4757; }
.wrong-attempts { margin-top: 8px; font-size: 0.9em; color: #ccc; }

/* 结果界面 */
.result-screen {
  background: rgba(255,255,255,0.95); border-radius: 24px;
  padding: 36px 28px; text-align: center;
  box-shadow: 0 8px 32px rgba(0,0,0,0.1);
  animation: bounceIn 0.5s ease-out;
  width: 100%;
}
.result-screen h2 { font-size: 2em; margin-bottom: 6px; }
.result-emoji { font-size: 4em; margin: 10px 0; }
.result-stats {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  margin: 20px 0;
}
.stat-card {
  background: #f8f9fa; border-radius: 16px; padding: 16px;
}
.stat-card .stat-label { font-size: 0.9em; color: #888; }
.stat-card .stat-value { font-size: 1.8em; font-weight: 900; color: #333; }
.stat-card .stat-value.highlight { color: #ff6b6b; }

.result-detail { margin: 16px 0; text-align: left; }
.result-detail h3 { font-size: 1.1em; color: #666; margin-bottom: 10px; }
.detail-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 12px; border-radius: 10px; margin-bottom: 6px;
  font-size: 1.05em;
}
.detail-item.right { background: #e8f8f0; color: #2ed573; }
.detail-item.wrong-item { background: #ffe0e0; color: #ff4757; }
.detail-item .attempts-tag {
  font-size: 0.8em; background: rgba(0,0,0,0.08); padding: 2px 8px;
  border-radius: 8px; margin-left: 8px;
}

.btn-group { display: flex; gap: 12px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
.retry-btn, .home-btn {
  padding: 14px 36px; font-size: 1.15em; font-weight: bold;
  border: none; border-radius: 40px; cursor: pointer;
  transition: all 0.2s;
}
.retry-btn {
  background: linear-gradient(135deg, #ff6b6b, #ffa502);
  color: #fff; box-shadow: 0 4px 16px rgba(255,107,107,0.3);
}
.home-btn { background: #f0f0f0; color: #666; }
.retry-btn:hover, .home-btn:hover { transform: scale(1.05); }

/* 历史记录界面 */
.history-screen {
  background: rgba(255,255,255,0.95); border-radius: 24px;
  padding: 30px 24px; text-align: center;
  box-shadow: 0 8px 32px rgba(0,0,0,0.1);
  animation: bounceIn 0.5s ease-out;
  width: 100%;
}
.history-screen h2 { font-size: 1.6em; color: #333; margin-bottom: 16px; }
.history-empty { font-size: 1.1em; color: #aaa; padding: 30px 0; }

.history-list { max-height: 420px; overflow-y: auto; }
.history-item {
  display: flex; justify-content: space-between; align-items: center;
  background: #f8f9fa; border-radius: 14px; padding: 14px 16px;
  margin-bottom: 10px; text-align: left; cursor: pointer;
  transition: all 0.2s; border: 2px solid transparent;
}
.history-item:hover { border-color: #1e90ff; transform: scale(1.01); }
.history-left { flex: 1; }
.history-date { font-size: 0.85em; color: #999; }
.history-info { font-size: 1em; color: #555; font-weight: bold; margin-top: 4px; }
.history-right { text-align: right; }
.history-acc {
  font-size: 1.6em; font-weight: 900;
}
.history-acc.perfect { color: #2ed573; }
.history-acc.good { color: #1e90ff; }
.history-acc.ok { color: #ffa502; }
.history-acc.low { color: #ff4757; }
.history-time { font-size: 0.85em; color: #999; }
.history-diff {
  display: inline-block; font-size: 0.75em; padding: 2px 8px;
  border-radius: 8px; color: #fff; margin-left: 6px;
}
.history-diff.easy { background: #2ed573; }
.history-diff.medium { background: #ffa502; }
.history-diff.hard { background: #ff4757; }

.history-detail-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.4); z-index: 200;
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn 0.2s;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.history-detail-card {
  background: #fff; border-radius: 20px; padding: 28px 24px;
  max-width: 420px; width: 90%; max-height: 80vh; overflow-y: auto;
  animation: bounceIn 0.3s ease-out;
}
.history-detail-card h3 { font-size: 1.2em; color: #333; margin-bottom: 14px; }
.close-detail {
  float: right; font-size: 1.5em; cursor: pointer; color: #aaa;
  border: none; background: none; line-height: 1;
}
.close-detail:hover { color: #333; }

.clear-history-btn {
  margin-top: 16px; padding: 10px 28px; font-size: 0.95em;
  background: #ff4757; color: #fff; border: none; border-radius: 30px;
  cursor: pointer; opacity: 0.7; transition: all 0.2s;
}
.clear-history-btn:hover { opacity: 1; transform: scale(1.05); }

.confetti {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 100; overflow: hidden;
}
.confetti-piece {
  position: absolute; width: 10px; height: 10px;
  animation: confetti-fall 3s linear forwards;
}

.hidden { display: none !important; }

@media (max-width: 480px) {
  .game-title { font-size: 1.8em; }
  .question-text { font-size: 2.2em; }
  .answer-input { width: 100px; font-size: 1.6em; }
  .result-stats { grid-template-columns: 1fr 1fr; gap: 8px; }
}
</style>
</head>
<body>

<div class="scene-bg" id="sceneBg"></div>

<div class="container">
  <div class="game-title">🔢 除法小达人</div>
  <div class="game-subtitle">九九除法口诀大挑战</div>

  <!-- 开始界面 -->
  <div class="start-screen" id="startScreen">
    <h2>📐 准备好了吗？</h2>
    <p>根据九九乘法表出除法题<br>共 <strong>10</strong> 道题，答对自动跳下一题！</p>

    <div class="difficulty-section">
      <label>选择难度：</label>
      <div class="difficulty-btns">
        <button class="diff-btn selected" data-level="easy" onclick="selectDifficulty('easy')">🌱 简单<br><small>1~5的表</small></button>
        <button class="diff-btn" data-level="medium" onclick="selectDifficulty('medium')">🌟 中等<br><small>1~7的表</small></button>
        <button class="diff-btn" data-level="hard" onclick="selectDifficulty('hard')">🔥 困难<br><small>1~9的表</small></button>
      </div>
    </div>

    <button class="start-btn" onclick="startGame()">🚀 开始挑战！</button>
    <br>
    <button class="history-btn" onclick="showHistory()">📊 答题记录</button>
  </div>

  <!-- 游戏界面 -->
  <div class="game-area hidden" id="gameArea">
    <div class="info-bar">
      <div class="info-item">第 <span id="currentQ">1</span> / 10 题</div>
      <div class="info-item timer" id="timer">⏱ 0.0 秒</div>
      <div class="info-item">✅ <span id="correctCount">0</span></div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

    <div class="question-card" id="questionCard">
      <div class="question-num" id="questionNum">第 1 题</div>
      <div class="question-text">
        <span id="dividend"></span>
        <span class="operator"> ÷ </span>
        <span id="divisor"></span>
        <span class="equals"> = </span>
        <span class="qmark">?</span>
      </div>
      <input type="number" class="answer-input" id="answerInput" autofocus>
      <div class="feedback" id="feedback"></div>
      <div class="wrong-attempts" id="wrongAttempts"></div>
    </div>
  </div>

  <!-- 结果界面 -->
  <div class="result-screen hidden" id="resultScreen">
    <div class="result-emoji" id="resultEmoji"></div>
    <h2 id="resultTitle"></h2>
    <div class="result-stats">
      <div class="stat-card">
        <div class="stat-label">正确率</div>
        <div class="stat-value highlight" id="accuracy">0%</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">用时</div>
        <div class="stat-value" id="totalTime">0秒</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">一次答对</div>
        <div class="stat-value" id="rightCount" style="color:#2ed573;">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">出错题数</div>
        <div class="stat-value" id="wrongCount" style="color:#ff4757;">0</div>
      </div>
    </div>
    <div class="result-detail" id="resultDetail"></div>
    <div class="btn-group">
      <button class="retry-btn" onclick="startGame()">🔄 再来一次</button>
      <button class="home-btn" onclick="goHome()">🏠 返回首页</button>
    </div>
  </div>

  <!-- 历史记录界面 -->
  <div class="history-screen hidden" id="historyScreen">
    <h2>📊 答题记录</h2>
    <div class="history-list" id="historyList"></div>
    <div class="btn-group">
      <button class="home-btn" onclick="goHome()">🏠 返回首页</button>
      <button class="clear-history-btn" onclick="clearHistory()">🗑 清空记录</button>
    </div>
  </div>
</div>

<div class="confetti hidden" id="confetti"></div>

<script>
const TOTAL = 10;
const STORAGE_KEY = 'division_game_history';
let difficulty = 'easy';
let questions = [];
let currentIndex = 0;
let correctTotal = 0;
let results = [];
let timerStart = 0;
let timerInterval = null;
let transitioning = false;
let currentWrongAttempts = 0;
let questionStartTime = 0;

const diffRange = { easy: 5, medium: 7, hard: 9 };
const diffLabel = { easy: '简单', medium: '中等', hard: '困难' };

function initScene() {
  const bg = document.getElementById('sceneBg');
  const decos = ['🍎','🍊','🌻','⭐','🎈','🌈','🎯','📚','✏️','🎲','🔢','➗'];
  for (let i = 0; i < 14; i++) {
    const d = document.createElement('div');
    d.className = 'deco';
    d.textContent = decos[i % decos.length];
    d.style.left = Math.random() * 90 + 5 + '%';
    d.style.top = Math.random() * 85 + 5 + '%';
    d.style.fontSize = (20 + Math.random() * 20) + 'px';
    d.style.animationDelay = (Math.random() * 3) + 's';
    d.style.animationDuration = (2.5 + Math.random() * 2) + 's';
    bg.appendChild(d);
  }
}

function selectDifficulty(level) {
  difficulty = level;
  document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('selected'));
  document.querySelector(`[data-level="${level}"]`).classList.add('selected');
}

function generateQuestions() {
  const max = diffRange[difficulty];
  const pool = [];
  for (let a = 1; a <= max; a++) {
    for (let b = a; b <= 9; b++) {
      pool.push({ dividend: a * b, divisor: a, answer: b });
      if (a !== b) pool.push({ dividend: a * b, divisor: b, answer: a });
    }
  }
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, TOTAL);
}

function startGame() {
  questions = generateQuestions();
  currentIndex = 0;
  correctTotal = 0;
  results = [];
  transitioning = false;

  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('historyScreen').classList.add('hidden');
  document.getElementById('confetti').classList.add('hidden');
  document.getElementById('gameArea').classList.remove('hidden');

  timerStart = Date.now();
  updateTimer();
  timerInterval = setInterval(updateTimer, 100);

  showQuestion();
}

function updateTimer() {
  const elapsed = (Date.now() - timerStart) / 1000;
  document.getElementById('timer').textContent = '⏱ ' + elapsed.toFixed(1) + ' 秒';
}

function showQuestion() {
  transitioning = false;
  currentWrongAttempts = 0;
  questionStartTime = Date.now();

  const q = questions[currentIndex];
  document.getElementById('currentQ').textContent = currentIndex + 1;
  document.getElementById('questionNum').textContent = `第 ${currentIndex + 1} 题`;
  document.getElementById('dividend').textContent = q.dividend;
  document.getElementById('divisor').textContent = q.divisor;
  document.getElementById('progressFill').style.width = (currentIndex / TOTAL * 100) + '%';
  document.getElementById('correctCount').textContent = correctTotal;

  const input = document.getElementById('answerInput');
  input.value = '';
  input.className = 'answer-input';
  input.disabled = false;
  setTimeout(() => input.focus(), 50);

  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('wrongAttempts').textContent = '';

  const card = document.getElementById('questionCard');
  card.className = 'question-card';
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = 'bounceIn 0.4s ease-out';
}

document.getElementById('answerInput').addEventListener('input', function() {
  if (transitioning) return;
  const val = this.value.trim();
  if (val === '' || val === '-') return;

  const userAnswer = parseInt(val);
  if (isNaN(userAnswer)) {
    this.value = '';
    return;
  }

  const q = questions[currentIndex];

  if (userAnswer === q.answer) {
    handleCorrect(q, userAnswer);
  } else if (val.length >= String(q.answer).length) {
    handleWrong(q, userAnswer);
  }
});

function handleCorrect(q, userAnswer) {
  transitioning = true;
  correctTotal++;
  const input = document.getElementById('answerInput');
  input.classList.add('correct');
  input.disabled = true;

  const fb = document.getElementById('feedback');
  const msgs = ['太棒了！🎉','真厉害！⭐','完全正确！✨','聪明！🧠','很好！👏'];
  fb.textContent = msgs[Math.floor(Math.random() * msgs.length)];
  fb.className = 'feedback correct-fb';

  const qTime = ((Date.now() - questionStartTime) / 1000).toFixed(1);
  results.push({
    question: `${q.dividend} ÷ ${q.divisor}`,
    correctAnswer: q.answer,
    wrongAttempts: currentWrongAttempts,
    time: qTime
  });

  document.getElementById('correctCount').textContent = correctTotal;

  setTimeout(() => {
    currentIndex++;
    if (currentIndex < TOTAL) {
      showQuestion();
    } else {
      endGame();
    }
  }, 600);
}

function handleWrong(q, userAnswer) {
  transitioning = true;
  currentWrongAttempts++;
  const input = document.getElementById('answerInput');
  input.classList.add('wrong');

  const card = document.getElementById('questionCard');
  card.className = 'question-card shake';

  const fb = document.getElementById('feedback');
  const wrongMsgs = ['再想想～🤔','不对哦～','换个答案试试！'];
  fb.textContent = wrongMsgs[Math.floor(Math.random() * wrongMsgs.length)];
  fb.className = 'feedback wrong-fb';

  document.getElementById('wrongAttempts').textContent =
    currentWrongAttempts === 1 ? '已错 1 次' : `已错 ${currentWrongAttempts} 次`;

  setTimeout(() => {
    input.value = '';
    input.className = 'answer-input';
    card.className = 'question-card';
    fb.textContent = '';
    fb.className = 'feedback';
    transitioning = false;
    input.focus();
  }, 500);
}

function endGame() {
  clearInterval(timerInterval);
  const elapsed = ((Date.now() - timerStart) / 1000).toFixed(1);
  const firstTryCorrect = results.filter(r => r.wrongAttempts === 0).length;
  const acc = Math.round(firstTryCorrect / TOTAL * 100);

  document.getElementById('gameArea').classList.add('hidden');
  document.getElementById('resultScreen').classList.remove('hidden');

  document.getElementById('accuracy').textContent = acc + '%';
  document.getElementById('totalTime').textContent = elapsed + '秒';
  document.getElementById('rightCount').textContent = firstTryCorrect;
  document.getElementById('wrongCount').textContent = TOTAL - firstTryCorrect;

  let emoji, title;
  if (acc === 100) { emoji = '🏆🎉🌟'; title = '满分！除法天才！'; showConfetti(); }
  else if (acc >= 80) { emoji = '🌟😊'; title = '非常棒！继续加油！'; }
  else if (acc >= 60) { emoji = '👍😄'; title = '还不错，再练练！'; }
  else { emoji = '💪📖'; title = '别灰心，多练习！'; }

  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultTitle').textContent = title;

  const detailEl = document.getElementById('resultDetail');
  detailEl.innerHTML = '<h3>📋 答题详情：</h3>';
  results.forEach((r) => {
    const isFirstTry = r.wrongAttempts === 0;
    const cls = isFirstTry ? 'right' : 'wrong-item';
    const icon = isFirstTry ? '✅' : '🔄';
    const attemptsTag = r.wrongAttempts > 0
      ? `<span class="attempts-tag">错了${r.wrongAttempts}次</span>` : '';
    detailEl.innerHTML += `<div class="detail-item ${cls}">
      <span>${icon} ${r.question} = ${r.correctAnswer} ${attemptsTag}</span>
      <span style="color:#999;font-size:0.85em;">${r.time}秒</span>
    </div>`;
  });

  document.getElementById('progressFill').style.width = '100%';

  saveHistory(elapsed, acc);
}

function saveHistory(elapsed, acc) {
  const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  history.unshift({
    date: new Date().toLocaleString('zh-CN'),
    difficulty,
    diffLabel: diffLabel[difficulty],
    elapsed: elapsed + '秒',
    accuracy: acc,
    firstTryCorrect: results.filter(r => r.wrongAttempts === 0).length,
    total: TOTAL,
    details: results
  });
  if (history.length > 50) history.length = 50;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
}

function showHistory() {
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('historyScreen').classList.remove('hidden');

  const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  const listEl = document.getElementById('historyList');

  if (history.length === 0) {
    listEl.innerHTML = '<div class="history-empty">还没有答题记录哦～<br>快去挑战吧！🚀</div>';
    return;
  }

  listEl.innerHTML = '';
  history.forEach((h, i) => {
    const accClass = h.accuracy === 100 ? 'perfect' : h.accuracy >= 80 ? 'good' : h.accuracy >= 60 ? 'ok' : 'low';
    const item = document.createElement('div');
    item.className = 'history-item';
    item.onclick = () => showHistoryDetail(h);
    item.innerHTML = `
      <div class="history-left">
        <div class="history-date">${h.date}</div>
        <div class="history-info">
          答对 ${h.firstTryCorrect}/${h.total}
          <span class="history-diff ${h.difficulty}">${h.diffLabel}</span>
        </div>
      </div>
      <div class="history-right">
        <div class="history-acc ${accClass}">${h.accuracy}%</div>
        <div class="history-time">⏱ ${h.elapsed}</div>
      </div>`;
    listEl.appendChild(item);
  });
}

function showHistoryDetail(record) {
  const overlay = document.createElement('div');
  overlay.className = 'history-detail-overlay';
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

  let detailHtml = `<button class="close-detail" onclick="this.closest('.history-detail-overlay').remove()">✕</button>`;
  detailHtml += `<h3>📋 ${record.date} 的答题详情</h3>`;
  detailHtml += `<p style="color:#888;margin-bottom:12px;">${record.diffLabel}难度 · 用时 ${record.elapsed} · 正确率 ${record.accuracy}%</p>`;

  if (record.details) {
    record.details.forEach(r => {
      const isFirstTry = r.wrongAttempts === 0;
      const cls = isFirstTry ? 'right' : 'wrong-item';
      const icon = isFirstTry ? '✅' : '🔄';
      const tag = r.wrongAttempts > 0 ? `<span class="attempts-tag">错了${r.wrongAttempts}次</span>` : '';
      detailHtml += `<div class="detail-item ${cls}">
        <span>${icon} ${r.question} = ${r.correctAnswer} ${tag}</span>
        <span style="color:#999;font-size:0.85em">${r.time}秒</span>
      </div>`;
    });
  } else {
    detailHtml += '<p style="color:#aaa;">该记录无详细数据</p>';
  }

  const card = document.createElement('div');
  card.className = 'history-detail-card';
  card.innerHTML = detailHtml;
  overlay.appendChild(card);
  document.body.appendChild(overlay);
}

function clearHistory() {
  if (confirm('确定要清空所有答题记录吗？')) {
    localStorage.removeItem(STORAGE_KEY);
    showHistory();
  }
}

function showConfetti() {
  const container = document.getElementById('confetti');
  container.classList.remove('hidden');
  container.innerHTML = '';
  const colors = ['#ff6b6b','#ffa502','#2ed573','#1e90ff','#a55eea','#ff4757','#FFD700'];
  for (let i = 0; i < 60; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = (Math.random() * 2) + 's';
    piece.style.animationDuration = (2 + Math.random() * 2) + 's';
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    piece.style.width = (6 + Math.random() * 8) + 'px';
    piece.style.height = (6 + Math.random() * 8) + 'px';
    container.appendChild(piece);
  }
  setTimeout(() => container.classList.add('hidden'), 4000);
}

function goHome() {
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('gameArea').classList.add('hidden');
  document.getElementById('historyScreen').classList.add('hidden');
  document.getElementById('startScreen').classList.remove('hidden');
  clearInterval(timerInterval);
}

initScene();
</script>
</body>
