<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>口算小达人 - 加减乘除练习</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes bounceIn { 0% { transform: scale(0); opacity: 0; } 60% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
@keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes rainbow { 0% { color: #ff6b6b; } 20% { color: #ffa502; } 40% { color: #2ed573; } 60% { color: #1e90ff; } 80% { color: #a55eea; } 100% { color: #ff6b6b; } }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
@keyframes confetti-fall { 0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
@keyframes correctFlash { 0% { box-shadow: 0 0 0 0 rgba(46,213,115,0.6); } 100% { box-shadow: 0 0 30px 10px rgba(46,213,115,0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

body {
  font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', sans-serif;
  min-height: 100vh; overflow-x: hidden;
  background: linear-gradient(180deg, #a8e6cf 0%, #dcedc1 40%, #ffd3b6 80%, #ffaaa5 100%);
  position: relative;
}

.scene-bg {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0; overflow: hidden;
}
.deco { position: absolute; font-size: 32px; animation: float 3s ease-in-out infinite; opacity: 0.6; }

.container {
  position: relative; z-index: 1;
  max-width: 620px; margin: 0 auto; padding: 16px 20px;
  min-height: 100vh; display: flex; flex-direction: column; align-items: center;
}

.game-title {
  font-size: 2.4em; font-weight: 900; text-align: center;
  animation: rainbow 3s linear infinite;
  text-shadow: 2px 2px 0 rgba(0,0,0,0.1);
  margin: 8px 0 2px;
}
.game-subtitle { font-size: 1em; color: #666; text-align: center; margin-bottom: 14px; }

/* 模式选择 */
.mode-screen {
  width: 100%; animation: bounceIn 0.5s ease-out;
}
.mode-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px;
}
.mode-card {
  background: rgba(255,255,255,0.93); border-radius: 20px;
  padding: 24px 16px; text-align: center; cursor: pointer;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  border: 3px solid transparent;
  transition: all 0.25s;
}
.mode-card:hover { transform: translateY(-4px); box-shadow: 0 8px 28px rgba(0,0,0,0.12); }
.mode-card.selected { border-color: #1e90ff; background: #eef6ff; }
.mode-icon { font-size: 2.6em; margin-bottom: 8px; }
.mode-name { font-size: 1.2em; font-weight: 900; color: #333; }
.mode-desc { font-size: 0.85em; color: #999; margin-top: 4px; }

/* 设置区 */
.settings-panel {
  background: rgba(255,255,255,0.92); border-radius: 20px;
  padding: 24px; width: 100%;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  animation: slideUp 0.3s ease-out;
}
.settings-panel h3 { font-size: 1.15em; color: #444; margin-bottom: 12px; text-align: center; }

.difficulty-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 16px; }
.diff-btn {
  padding: 10px 18px; border: 3px solid #ddd; border-radius: 14px;
  background: #fff; font-size: 0.95em; cursor: pointer; font-weight: bold;
  transition: all 0.2s;
}
.diff-btn:hover { transform: scale(1.05); }
.diff-btn.selected { border-color: #2ed573; background: #e8f8f0; color: #2ed573; }
.diff-btn.selected::after { content: ' ✓'; }

.action-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.start-btn {
  padding: 14px 44px; font-size: 1.3em; font-weight: bold;
  background: linear-gradient(135deg, #ff6b6b, #ffa502);
  color: #fff; border: none; border-radius: 50px;
  cursor: pointer; box-shadow: 0 4px 16px rgba(255,107,107,0.4);
  transition: all 0.2s;
}
.start-btn:hover { transform: scale(1.06); }
.history-btn {
  padding: 14px 32px; font-size: 1.1em; font-weight: bold;
  background: linear-gradient(135deg, #a55eea, #8854d0);
  color: #fff; border: none; border-radius: 50px;
  cursor: pointer; box-shadow: 0 4px 16px rgba(165,94,234,0.3);
  transition: all 0.2s;
}
.history-btn:hover { transform: scale(1.06); }

/* 游戏界面 */
.game-area { width: 100%; animation: slideUp 0.4s ease-out; }
.info-bar {
  display: flex; justify-content: space-between; align-items: center;
  background: rgba(255,255,255,0.9); border-radius: 16px;
  padding: 12px 20px; margin-bottom: 14px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}
.info-item { font-size: 1.05em; font-weight: bold; color: #555; }
.info-item span { color: #ff6b6b; }
.timer { font-size: 1.2em; }
.mode-tag {
  display: inline-block; font-size: 0.75em; padding: 3px 10px;
  border-radius: 10px; color: #fff; font-weight: bold; margin-left: 4px;
}
.mode-tag.addsub { background: #1e90ff; }
.mode-tag.multiply { background: #2ed573; }
.mode-tag.divide { background: #ffa502; }
.mode-tag.mixed { background: #a55eea; }
.mode-tag.wrongbook { background: #ff4757; }

.progress-bar {
  width: 100%; height: 10px; background: rgba(255,255,255,0.6);
  border-radius: 5px; margin-bottom: 16px; overflow: hidden;
}
.progress-fill {
  height: 100%; background: linear-gradient(90deg, #2ed573, #7bed9f);
  border-radius: 5px; transition: width 0.4s ease;
}

.question-card {
  background: rgba(255,255,255,0.95); border-radius: 24px;
  padding: 32px 24px; text-align: center;
  box-shadow: 0 8px 32px rgba(0,0,0,0.08);
  animation: bounceIn 0.4s ease-out;
}
.question-card.shake { animation: shake 0.5s ease; }
.question-num { font-size: 0.9em; color: #aaa; margin-bottom: 6px; }
.question-text {
  font-size: 2.6em; font-weight: 900; color: #333;
  margin: 12px 0 20px; letter-spacing: 2px;
}
.question-text .op { color: #ff6b6b; }
.question-text .eq { color: #2ed573; }
.question-text .qmark { color: #ffa502; animation: pulse 1s infinite; display: inline-block; }

.answer-input {
  width: 130px; padding: 12px; font-size: 2em; text-align: center;
  border: 4px solid #ddd; border-radius: 16px; outline: none;
  font-weight: bold; color: #333; background: #fafafa;
  transition: border-color 0.2s, background 0.2s;
  -moz-appearance: textfield;
}
.answer-input::-webkit-inner-spin-button,
.answer-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.answer-input:focus { border-color: #1e90ff; background: #fff; }
.answer-input.correct { border-color: #2ed573; background: #e8f8f0; animation: correctFlash 0.5s; }
.answer-input.wrong { border-color: #ff4757; background: #ffe0e0; }

.feedback {
  margin-top: 16px; font-size: 1.25em; font-weight: bold;
  min-height: 36px; transition: all 0.3s;
}
.feedback.correct-fb { color: #2ed573; animation: pop 0.3s; }
.feedback.wrong-fb { color: #ff4757; }
.wrong-attempts { margin-top: 6px; font-size: 0.85em; color: #ccc; }

/* 结果界面 */
.result-screen {
  background: rgba(255,255,255,0.95); border-radius: 24px;
  padding: 32px 24px; text-align: center;
  box-shadow: 0 8px 32px rgba(0,0,0,0.1);
  animation: bounceIn 0.5s ease-out;
  width: 100%;
}
.result-screen h2 { font-size: 1.8em; margin-bottom: 4px; }
.result-emoji { font-size: 3.5em; margin: 8px 0; }
.result-stats {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  margin: 16px 0;
}
.stat-card { background: #f8f9fa; border-radius: 14px; padding: 14px; }
.stat-card .stat-label { font-size: 0.85em; color: #888; }
.stat-card .stat-value { font-size: 1.6em; font-weight: 900; color: #333; }
.stat-card .stat-value.highlight { color: #ff6b6b; }

.result-detail { margin: 14px 0; text-align: left; }
.result-detail h3 { font-size: 1.05em; color: #666; margin-bottom: 8px; }
.detail-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 7px 12px; border-radius: 10px; margin-bottom: 5px;
  font-size: 1em;
}
.detail-item.right { background: #e8f8f0; color: #2ed573; }
.detail-item.wrong-item { background: #ffe0e0; color: #ff4757; }
.detail-item .attempts-tag {
  font-size: 0.78em; background: rgba(0,0,0,0.08); padding: 2px 8px;
  border-radius: 8px; margin-left: 6px;
}

.btn-group { display: flex; gap: 12px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
.retry-btn, .home-btn {
  padding: 13px 32px; font-size: 1.1em; font-weight: bold;
  border: none; border-radius: 40px; cursor: pointer;
  transition: all 0.2s;
}
.retry-btn {
  background: linear-gradient(135deg, #ff6b6b, #ffa502);
  color: #fff; box-shadow: 0 4px 16px rgba(255,107,107,0.3);
}
.home-btn { background: #f0f0f0; color: #666; }
.retry-btn:hover, .home-btn:hover { transform: scale(1.05); }

/* 历史记录 */
.history-screen {
  background: rgba(255,255,255,0.95); border-radius: 24px;
  padding: 28px 22px; text-align: center;
  box-shadow: 0 8px 32px rgba(0,0,0,0.1);
  animation: bounceIn 0.5s ease-out;
  width: 100%;
}
.history-screen h2 { font-size: 1.5em; color: #333; margin-bottom: 14px; }
.history-empty { font-size: 1.05em; color: #aaa; padding: 30px 0; }
.history-list { max-height: 400px; overflow-y: auto; }
.history-item {
  display: flex; justify-content: space-between; align-items: center;
  background: #f8f9fa; border-radius: 14px; padding: 12px 14px;
  margin-bottom: 8px; text-align: left; cursor: pointer;
  transition: all 0.2s; border: 2px solid transparent;
}
.history-item:hover { border-color: #1e90ff; transform: scale(1.01); }
.history-left { flex: 1; }
.history-date { font-size: 0.82em; color: #999; }
.history-info { font-size: 0.95em; color: #555; font-weight: bold; margin-top: 3px; }
.history-right { text-align: right; }
.history-acc { font-size: 1.5em; font-weight: 900; }
.history-acc.perfect { color: #2ed573; }
.history-acc.good { color: #1e90ff; }
.history-acc.ok { color: #ffa502; }
.history-acc.low { color: #ff4757; }
.history-time { font-size: 0.82em; color: #999; }
.history-badge {
  display: inline-block; font-size: 0.72em; padding: 2px 8px;
  border-radius: 8px; color: #fff; margin-left: 4px; font-weight: bold;
}
.history-badge.addsub { background: #1e90ff; }
.history-badge.multiply { background: #2ed573; }
.history-badge.divide { background: #ffa502; }
.history-badge.mixed { background: #a55eea; }
.history-badge.wrongbook { background: #ff4757; }

.history-detail-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.4); z-index: 200;
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn 0.2s;
}
.history-detail-card {
  background: #fff; border-radius: 20px; padding: 24px 20px;
  max-width: 420px; width: 92%; max-height: 80vh; overflow-y: auto;
  animation: bounceIn 0.3s ease-out;
}
.history-detail-card h3 { font-size: 1.15em; color: #333; margin-bottom: 12px; }
.close-detail {
  float: right; font-size: 1.5em; cursor: pointer; color: #aaa;
  border: none; background: none; line-height: 1;
}
.close-detail:hover { color: #333; }

.clear-history-btn {
  margin-top: 14px; padding: 10px 24px; font-size: 0.9em;
  background: #ff4757; color: #fff; border: none; border-radius: 30px;
  cursor: pointer; opacity: 0.7; transition: all 0.2s;
}
.clear-history-btn:hover { opacity: 1; transform: scale(1.05); }

.confetti {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 100; overflow: hidden;
}
.confetti-piece {
  position: absolute; width: 10px; height: 10px;
  animation: confetti-fall 3s linear forwards;
}

.hidden { display: none !important; }

@media (max-width: 480px) {
  .game-title { font-size: 1.8em; }
  .mode-grid { gap: 10px; }
  .mode-card { padding: 18px 10px; }
  .mode-icon { font-size: 2em; }
  .question-text { font-size: 2em; }
  .answer-input { width: 110px; font-size: 1.6em; }
}
</style>
</head>
<body>

<div class="scene-bg" id="sceneBg"></div>

<div class="container">
  <div class="game-title">🧮 口算小达人</div>
  <div class="game-subtitle">加减乘除大挑战</div>

  <!-- 模式选择 + 设置 -->
  <div class="mode-screen" id="modeScreen">
    <div class="mode-grid">
      <div class="mode-card selected" data-mode="addsub" onclick="selectMode('addsub')">
        <div class="mode-icon">➕➖</div>
        <div class="mode-name">加减法</div>
        <div class="mode-desc">100以内加减</div>
      </div>
      <div class="mode-card" data-mode="multiply" onclick="selectMode('multiply')">
        <div class="mode-icon">✖️</div>
        <div class="mode-name">乘法</div>
        <div class="mode-desc">九九乘法表</div>
      </div>
      <div class="mode-card" data-mode="divide" onclick="selectMode('divide')">
        <div class="mode-icon">➗</div>
        <div class="mode-name">除法</div>
        <div class="mode-desc">九九除法口诀</div>
      </div>
      <div class="mode-card" data-mode="mixed" onclick="selectMode('mixed')">
        <div class="mode-icon">🔀</div>
        <div class="mode-name">混合运算</div>
        <div class="mode-desc">加减乘除随机</div>
      </div>
      <div class="mode-card" data-mode="wrongbook" onclick="selectMode('wrongbook')">
        <div class="mode-icon">📕</div>
        <div class="mode-name">错题集</div>
        <div class="mode-desc">专练做错的题</div>
      </div>
    </div>

    <div class="settings-panel" id="settingsPanel">
      <h3 id="diffTitle">选择难度：</h3>
      <div class="difficulty-btns" id="diffBtns">
        <button class="diff-btn selected" data-level="easy" onclick="selectDifficulty('easy')">🌱 简单</button>
        <button class="diff-btn" data-level="medium" onclick="selectDifficulty('medium')">🌟 中等</button>
        <button class="diff-btn" data-level="hard" onclick="selectDifficulty('hard')">🔥 困难</button>
      </div>
      <div id="diffHint" style="font-size:0.85em;color:#aaa;text-align:center;margin-bottom:14px;"></div>
      <div class="action-btns">
        <button class="start-btn" onclick="startGame()">🚀 开始挑战！</button>
        <button class="history-btn" onclick="showHistory()">📊 记录</button>
        <button class="history-btn" onclick="showWrongBook()">📕 错题集</button>
      </div>
    </div>
  </div>

  <!-- 游戏界面 -->
  <div class="game-area hidden" id="gameArea">
    <div class="info-bar">
      <div class="info-item">第 <span id="currentQ">1</span>/10 <span class="mode-tag" id="modeTag"></span></div>
      <div class="info-item timer" id="timer">⏱ 0.0s</div>
      <div class="info-item">✅ <span id="correctCount">0</span></div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

    <div class="question-card" id="questionCard">
      <div class="question-num" id="questionNum">第 1 题</div>
      <div class="question-text" id="questionText"></div>
      <input type="number" class="answer-input" id="answerInput" autofocus>
      <div class="feedback" id="feedback"></div>
      <div class="wrong-attempts" id="wrongAttempts"></div>
    </div>
  </div>

  <!-- 结果界面 -->
  <div class="result-screen hidden" id="resultScreen">
    <div class="result-emoji" id="resultEmoji"></div>
    <h2 id="resultTitle"></h2>
    <div class="result-stats">
      <div class="stat-card">
        <div class="stat-label">正确率</div>
        <div class="stat-value highlight" id="accuracy">0%</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">用时</div>
        <div class="stat-value" id="totalTime">0秒</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">一次答对</div>
        <div class="stat-value" id="rightCount" style="color:#2ed573;">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">出错题数</div>
        <div class="stat-value" id="wrongCount" style="color:#ff4757;">0</div>
      </div>
    </div>
    <div class="result-detail" id="resultDetail"></div>
    <div class="btn-group">
      <button class="retry-btn" onclick="startGame()">🔄 再来一次</button>
      <button class="home-btn" onclick="goHome()">🏠 返回首页</button>
    </div>
  </div>

  <!-- 历史记录 -->
  <div class="history-screen hidden" id="historyScreen">
    <h2>📊 答题记录</h2>
    <div class="history-list" id="historyList"></div>
    <div class="btn-group">
      <button class="home-btn" onclick="goHome()">🏠 返回首页</button>
      <button class="clear-history-btn" onclick="clearHistory()">🗑 清空记录</button>
    </div>
  </div>

  <!-- 错题集 -->
  <div class="history-screen hidden" id="wrongBookScreen">
    <h2>📕 错题集</h2>
    <div class="history-list" id="wrongBookList"></div>
    <div class="btn-group">
      <button class="home-btn" onclick="goHome()">🏠 返回首页</button>
      <button class="history-btn" onclick="startWrongBookGame()">📝 刷错题</button>
      <button class="clear-history-btn" onclick="clearWrongBook()">🗑 清空错题集</button>
    </div>
  </div>
</div>

<div class="confetti hidden" id="confetti"></div>

<script>
const TOTAL = 10;
const STORAGE_KEY = 'math_game_history';
const WRONGBOOK_KEY = 'math_game_wrongbook_v1';

let gameMode = 'addsub';
let difficulty = 'easy';
let questions = [];
let currentIndex = 0;
let correctTotal = 0;
let results = [];
let timerStart = 0;
let timerInterval = null;
let transitioning = false;
let currentWrongAttempts = 0;
let questionStartTime = 0;

const modeLabels = { addsub: '加减法', multiply: '乘法', divide: '除法', mixed: '混合运算', wrongbook: '错题集' };
const diffLabels = { easy: '简单', medium: '中等', hard: '困难' };

const diffHints = {
  addsub: { easy: '20以内加减', medium: '50以内加减', hard: '100以内加减' },
  multiply: { easy: '1~5的表', medium: '1~7的表', hard: '1~9的表' },
  divide: { easy: '1~5的表', medium: '1~7的表', hard: '1~9的表' },
  mixed: { easy: '20以内 + 5以内表', medium: '50以内 + 7以内表', hard: '100以内 + 9以内表' },
  wrongbook: { easy: '按错题出题', medium: '按错题出题', hard: '按错题出题' }
};

function initScene() {
  const bg = document.getElementById('sceneBg');
  const decos = ['🍎','🍊','🌻','⭐','🎈','🌈','🎯','📚','✏️','🎲','🔢','➗','✖️','➕','➖'];
  for (let i = 0; i < 14; i++) {
    const d = document.createElement('div');
    d.className = 'deco';
    d.textContent = decos[i % decos.length];
    d.style.left = Math.random() * 90 + 5 + '%';
    d.style.top = Math.random() * 85 + 5 + '%';
    d.style.fontSize = (20 + Math.random() * 20) + 'px';
    d.style.animationDelay = (Math.random() * 3) + 's';
    d.style.animationDuration = (2.5 + Math.random() * 2) + 's';
    bg.appendChild(d);
  }
}

function selectMode(mode) {
  gameMode = mode;
  document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('selected'));
  document.querySelector(`[data-mode="${mode}"]`).classList.add('selected');
  updateDiffHint();
}

function selectDifficulty(level) {
  difficulty = level;
  document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('selected'));
  document.querySelector(`[data-level="${level}"]`).classList.add('selected');
  updateDiffHint();
}

function updateDiffHint() {
  document.getElementById('diffHint').textContent = diffHints[gameMode][difficulty];
}

function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function loadWrongBook() {
  try {
    const raw = localStorage.getItem(WRONGBOOK_KEY);
    const items = JSON.parse(raw || '[]');
    return Array.isArray(items) ? items : [];
  } catch {
    return [];
  }
}

function saveWrongBook(items) {
  localStorage.setItem(WRONGBOOK_KEY, JSON.stringify(items));
}

function wrongBookIdFromText(text, mode) {
  return `${mode}|${text}`;
}

function genAddSub(diff) {
  const maxNum = diff === 'easy' ? 20 : diff === 'medium' ? 50 : 100;
  const pool = [];
  for (let i = 0; i < 80; i++) {
    if (Math.random() < 0.5) {
      const a = randInt(1, maxNum - 1);
      const b = randInt(1, maxNum - a);
      pool.push({ mode: 'addsub', text: `${a} + ${b}`, display: `${a}<span class="op"> + </span>${b}`, answer: a + b });
    } else {
      const a = randInt(2, maxNum);
      const b = randInt(1, a - 1);
      pool.push({ mode: 'addsub', text: `${a} − ${b}`, display: `${a}<span class="op"> − </span>${b}`, answer: a - b });
    }
  }
  return shuffle(pool).slice(0, TOTAL);
}

function genMultiply(diff) {
  const max = diff === 'easy' ? 5 : diff === 'medium' ? 7 : 9;
  const pool = [];
  for (let a = 1; a <= max; a++) {
    for (let b = a; b <= 9; b++) {
      pool.push({ mode: 'multiply', text: `${a} × ${b}`, display: `${a}<span class="op"> × </span>${b}`, answer: a * b });
      if (a !== b) pool.push({ mode: 'multiply', text: `${b} × ${a}`, display: `${b}<span class="op"> × </span>${a}`, answer: a * b });
    }
  }
  return shuffle(pool).slice(0, TOTAL);
}

function genDivide(diff) {
  const max = diff === 'easy' ? 5 : diff === 'medium' ? 7 : 9;
  const pool = [];
  for (let a = 1; a <= max; a++) {
    for (let b = a; b <= 9; b++) {
      pool.push({ mode: 'divide', text: `${a * b} ÷ ${a}`, display: `${a * b}<span class="op"> ÷ </span>${a}`, answer: b });
      if (a !== b) pool.push({ mode: 'divide', text: `${a * b} ÷ ${b}`, display: `${a * b}<span class="op"> ÷ </span>${b}`, answer: a });
    }
  }
  return shuffle(pool).slice(0, TOTAL);
}

function genMixed(diff) {
  const adds = genAddSub(diff);
  const muls = genMultiply(diff);
  const divs = genDivide(diff);
  const all = [...adds, ...muls, ...divs];
  return shuffle(all).slice(0, TOTAL);
}

function formatQuestionDisplayFromText(text) {
  return String(text)
    .replace(' × ', '<span class="op"> × </span>')
    .replace(' ÷ ', '<span class="op"> ÷ </span>')
    .replace(' + ', '<span class="op"> + </span>')
    .replace(' − ', '<span class="op"> − </span>');
}

function pickWrongBookQuestions(items) {
  const now = Date.now();
  const list = Array.isArray(items) ? items : [];
  if (list.length === 0) return [];

  function weightOf(i) {
    const wrongGames = i.wrongGames || 0;
    const wrongTotalAttempts = i.wrongTotalAttempts || 0;
    const lastSeenAt = i.lastSeenAt || 0;
    const days = lastSeenAt ? (now - lastSeenAt) / (1000 * 3600 * 24) : 999;
    const freshnessBoost = Math.min(10, Math.max(0, days));
    return 1 + wrongGames + 0.2 * wrongTotalAttempts + freshnessBoost;
  }

  function pickOneWeighted() {
    const weights = list.map(weightOf);
    const sum = weights.reduce((a, b) => a + b, 0);
    let r = Math.random() * sum;
    for (let idx = 0; idx < list.length; idx++) {
      r -= weights[idx];
      if (r <= 0) return list[idx];
    }
    return list[list.length - 1];
  }

  const picked = [];
  for (let i = 0; i < TOTAL; i++) {
    const it = pickOneWeighted();
    picked.push({
      mode: it.mode || 'mixed',
      text: it.questionText,
      display: formatQuestionDisplayFromText(it.questionText),
      answer: it.answer
    });
  }
  return picked;
}

function generateQuestions() {
  switch (gameMode) {
    case 'addsub': return genAddSub(difficulty);
    case 'multiply': return genMultiply(difficulty);
    case 'divide': return genDivide(difficulty);
    case 'mixed': return genMixed(difficulty);
  }
}

function startGame() {
  if (gameMode === 'wrongbook') {
    const items = loadWrongBook();
    if (items.length === 0) {
      alert('还没有错题哦～先去挑战一局吧！');
      goHome();
      return;
    }
    questions = pickWrongBookQuestions(items);
  } else {
    questions = generateQuestions();
  }
  currentIndex = 0;
  correctTotal = 0;
  results = [];
  transitioning = false;

  document.getElementById('modeScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('historyScreen').classList.add('hidden');
  document.getElementById('wrongBookScreen').classList.add('hidden');
  document.getElementById('confetti').classList.add('hidden');
  document.getElementById('gameArea').classList.remove('hidden');

  const tag = document.getElementById('modeTag');
  tag.textContent = modeLabels[gameMode];
  tag.className = 'mode-tag ' + gameMode;

  timerStart = Date.now();
  updateTimer();
  timerInterval = setInterval(updateTimer, 100);

  showQuestion();
}

function updateTimer() {
  const elapsed = (Date.now() - timerStart) / 1000;
  document.getElementById('timer').textContent = '⏱ ' + elapsed.toFixed(1) + 's';
}

function showQuestion() {
  transitioning = false;
  currentWrongAttempts = 0;
  questionStartTime = Date.now();

  const q = questions[currentIndex];
  document.getElementById('currentQ').textContent = currentIndex + 1;
  document.getElementById('questionNum').textContent = `第 ${currentIndex + 1} 题`;
  document.getElementById('questionText').innerHTML =
    q.display + `<span class="eq"> = </span><span class="qmark">?</span>`;
  document.getElementById('progressFill').style.width = (currentIndex / TOTAL * 100) + '%';
  document.getElementById('correctCount').textContent = correctTotal;

  const input = document.getElementById('answerInput');
  input.value = '';
  input.className = 'answer-input';
  input.disabled = false;
  setTimeout(() => input.focus(), 50);

  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('wrongAttempts').textContent = '';

  const card = document.getElementById('questionCard');
  card.className = 'question-card';
  card.style.animation = 'none';
  void card.offsetHeight;
  card.style.animation = 'bounceIn 0.4s ease-out';
}

document.getElementById('answerInput').addEventListener('input', function() {
  if (transitioning) return;
  const val = this.value.trim();
  if (val === '' || val === '-') return;

  const userAnswer = parseInt(val);
  if (isNaN(userAnswer)) { this.value = ''; return; }

  const q = questions[currentIndex];
  const ansStr = String(q.answer);
  const negative = q.answer < 0;

  if (userAnswer === q.answer) {
    handleCorrect(q);
  } else if (val.length >= ansStr.length) {
    handleWrong(q);
  }
});

function handleCorrect(q) {
  transitioning = true;
  correctTotal++;
  const input = document.getElementById('answerInput');
  input.classList.add('correct');
  input.disabled = true;

  const fb = document.getElementById('feedback');
  const msgs = ['太棒了！🎉','真厉害！⭐','完全正确！✨','聪明！🧠','很好！👏','漂亮！🌟'];
  fb.textContent = msgs[Math.floor(Math.random() * msgs.length)];
  fb.className = 'feedback correct-fb';

  const qTime = ((Date.now() - questionStartTime) / 1000).toFixed(1);
  results.push({
    question: q.text,
    correctAnswer: q.answer,
    wrongAttempts: currentWrongAttempts,
    time: qTime,
    mode: q.mode || gameMode,
    sourceMode: gameMode
  });
  document.getElementById('correctCount').textContent = correctTotal;

  setTimeout(() => {
    currentIndex++;
    if (currentIndex < TOTAL) showQuestion(); else endGame();
  }, 600);
}

function handleWrong(q) {
  transitioning = true;
  currentWrongAttempts++;
  const input = document.getElementById('answerInput');
  input.classList.add('wrong');

  const card = document.getElementById('questionCard');
  card.className = 'question-card shake';

  const fb = document.getElementById('feedback');
  const msgs = ['再想想～🤔','不对哦～','换个答案试试！'];
  fb.textContent = msgs[Math.floor(Math.random() * msgs.length)];
  fb.className = 'feedback wrong-fb';

  document.getElementById('wrongAttempts').textContent = `已错 ${currentWrongAttempts} 次`;

  setTimeout(() => {
    input.value = '';
    input.className = 'answer-input';
    card.className = 'question-card';
    fb.textContent = '';
    fb.className = 'feedback';
    transitioning = false;
    input.focus();
  }, 500);
}

function upsertWrongBookFromResults(results) {
  const items = loadWrongBook();
  const byId = new Map(items.map(i => [i.id, i]));
  const now = Date.now();

  results.forEach(r => {
    if (!r || !r.question) return;
    if (!r.wrongAttempts || r.wrongAttempts <= 0) return;

    const mode = r.mode || 'mixed';
    const id = wrongBookIdFromText(r.question, mode);
    const existing = byId.get(id);

    const next = existing || {
      id,
      questionText: r.question,
      answer: r.correctAnswer,
      mode,
      sourceMode: r.sourceMode || mode,
      wrongGames: 0,
      wrongTotalAttempts: 0,
      lastWrongAt: 0,
      lastSeenAt: 0
    };

    next.questionText = r.question;
    next.answer = r.correctAnswer;
    next.mode = mode;
    next.sourceMode = r.sourceMode || next.sourceMode || mode;
    next.wrongGames += 1;
    next.wrongTotalAttempts += r.wrongAttempts;
    next.lastWrongAt = now;
    next.lastSeenAt = now;

    byId.set(id, next);
  });

  saveWrongBook(Array.from(byId.values()));
}

function endGame() {
  clearInterval(timerInterval);
  const elapsed = ((Date.now() - timerStart) / 1000).toFixed(1);
  const firstTryCorrect = results.filter(r => r.wrongAttempts === 0).length;
  const acc = Math.round(firstTryCorrect / TOTAL * 100);

  document.getElementById('gameArea').classList.add('hidden');
  document.getElementById('resultScreen').classList.remove('hidden');

  document.getElementById('accuracy').textContent = acc + '%';
  document.getElementById('totalTime').textContent = elapsed + '秒';
  document.getElementById('rightCount').textContent = firstTryCorrect;
  document.getElementById('wrongCount').textContent = TOTAL - firstTryCorrect;

  let emoji, title;
  if (acc === 100) { emoji = '🏆🎉🌟'; title = '满分！口算天才！'; showConfetti(); }
  else if (acc >= 80) { emoji = '🌟😊'; title = '非常棒！继续加油！'; }
  else if (acc >= 60) { emoji = '👍😄'; title = '还不错，再练练！'; }
  else { emoji = '💪📖'; title = '别灰心，多练习！'; }

  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultTitle').textContent = title;

  const detailEl = document.getElementById('resultDetail');
  detailEl.innerHTML = '<h3>📋 答题详情：</h3>';
  results.forEach(r => {
    const ok = r.wrongAttempts === 0;
    const tag = r.wrongAttempts > 0 ? `<span class="attempts-tag">错了${r.wrongAttempts}次</span>` : '';
    detailEl.innerHTML += `<div class="detail-item ${ok ? 'right' : 'wrong-item'}">
      <span>${ok ? '✅' : '🔄'} ${r.question} = ${r.correctAnswer} ${tag}</span>
      <span style="color:#999;font-size:0.83em;">${r.time}秒</span>
    </div>`;
  });

  document.getElementById('progressFill').style.width = '100%';
  upsertWrongBookFromResults(results);
  saveHistory(elapsed, acc);
}

function saveHistory(elapsed, acc) {
  const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  history.unshift({
    date: new Date().toLocaleString('zh-CN'),
    mode: gameMode,
    modeLabel: modeLabels[gameMode],
    difficulty,
    diffLabel: diffLabels[difficulty],
    elapsed: elapsed + '秒',
    accuracy: acc,
    firstTryCorrect: results.filter(r => r.wrongAttempts === 0).length,
    total: TOTAL,
    details: results
  });
  if (history.length > 50) history.length = 50;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
}

function showWrongBook() {
  document.getElementById('modeScreen').classList.add('hidden');
  document.getElementById('historyScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('gameArea').classList.add('hidden');
  document.getElementById('wrongBookScreen').classList.remove('hidden');

  const items = loadWrongBook();
  const listEl = document.getElementById('wrongBookList');
  if (items.length === 0) {
    listEl.innerHTML = '<div class="history-empty">还没有错题哦～<br>先去挑战一局吧！</div>';
    return;
  }

  const sorted = [...items].sort((a, b) =>
    (b.wrongGames || 0) - (a.wrongGames || 0) ||
    (b.wrongTotalAttempts || 0) - (a.wrongTotalAttempts || 0) ||
    (b.lastWrongAt || 0) - (a.lastWrongAt || 0)
  );

  listEl.innerHTML = '';
  sorted.forEach(it => {
    const item = document.createElement('div');
    item.className = 'history-item';
    const last = it.lastWrongAt ? new Date(it.lastWrongAt).toLocaleString('zh-CN') : '-';
    item.innerHTML = `
      <div class="history-left">
        <div class="history-date">最近错题：${last}</div>
        <div class="history-info">
          ${it.questionText} = ${it.answer}
          <span class="history-badge ${it.mode || 'wrongbook'}">${modeLabels[it.mode] || it.mode || '错题'}</span>
        </div>
      </div>
      <div class="history-right">
        <div class="history-acc low">${it.wrongGames || 0}局</div>
        <div class="history-time">错${it.wrongTotalAttempts || 0}次</div>
      </div>`;
    listEl.appendChild(item);
  });
}

function clearWrongBook() {
  if (confirm('确定要清空错题集吗？')) {
    localStorage.removeItem(WRONGBOOK_KEY);
    showWrongBook();
  }
}

function startWrongBookGame() {
  gameMode = 'wrongbook';
  document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('selected'));
  const card = document.querySelector('[data-mode="wrongbook"]');
  if (card) card.classList.add('selected');
  updateDiffHint();
  startGame();
}

function showHistory() {
  document.getElementById('modeScreen').classList.add('hidden');
  document.getElementById('historyScreen').classList.remove('hidden');

  const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  const listEl = document.getElementById('historyList');

  if (history.length === 0) {
    listEl.innerHTML = '<div class="history-empty">还没有答题记录哦～<br>快去挑战吧！🚀</div>';
    return;
  }

  listEl.innerHTML = '';
  history.forEach(h => {
    const accCls = h.accuracy === 100 ? 'perfect' : h.accuracy >= 80 ? 'good' : h.accuracy >= 60 ? 'ok' : 'low';
    const item = document.createElement('div');
    item.className = 'history-item';
    item.onclick = () => showHistoryDetail(h);
    item.innerHTML = `
      <div class="history-left">
        <div class="history-date">${h.date}</div>
        <div class="history-info">
          答对 ${h.firstTryCorrect}/${h.total}
          <span class="history-badge ${h.mode}">${h.modeLabel}</span>
          <span class="history-badge" style="background:#888;">${h.diffLabel}</span>
        </div>
      </div>
      <div class="history-right">
        <div class="history-acc ${accCls}">${h.accuracy}%</div>
        <div class="history-time">⏱ ${h.elapsed}</div>
      </div>`;
    listEl.appendChild(item);
  });
}

function showHistoryDetail(record) {
  const overlay = document.createElement('div');
  overlay.className = 'history-detail-overlay';
  overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };

  let html = `<button class="close-detail" onclick="this.closest('.history-detail-overlay').remove()">✕</button>`;
  html += `<h3>📋 ${record.date}</h3>`;
  html += `<p style="color:#888;margin-bottom:12px;">${record.modeLabel} · ${record.diffLabel} · 用时 ${record.elapsed} · 正确率 ${record.accuracy}%</p>`;

  if (record.details) {
    record.details.forEach(r => {
      const ok = r.wrongAttempts === 0;
      const tag = r.wrongAttempts > 0 ? `<span class="attempts-tag">错了${r.wrongAttempts}次</span>` : '';
      html += `<div class="detail-item ${ok ? 'right' : 'wrong-item'}">
        <span>${ok ? '✅' : '🔄'} ${r.question} = ${r.correctAnswer} ${tag}</span>
        <span style="color:#999;font-size:0.83em">${r.time}秒</span>
      </div>`;
    });
  } else {
    html += '<p style="color:#aaa;">该记录无详细数据</p>';
  }

  const card = document.createElement('div');
  card.className = 'history-detail-card';
  card.innerHTML = html;
  overlay.appendChild(card);
  document.body.appendChild(overlay);
}

function clearHistory() {
  if (confirm('确定要清空所有答题记录吗？')) {
    localStorage.removeItem(STORAGE_KEY);
    showHistory();
  }
}

function showConfetti() {
  const c = document.getElementById('confetti');
  c.classList.remove('hidden');
  c.innerHTML = '';
  const colors = ['#ff6b6b','#ffa502','#2ed573','#1e90ff','#a55eea','#ff4757','#FFD700'];
  for (let i = 0; i < 60; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random() * 100 + '%';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDelay = (Math.random() * 2) + 's';
    p.style.animationDuration = (2 + Math.random() * 2) + 's';
    p.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    p.style.width = (6 + Math.random() * 8) + 'px';
    p.style.height = (6 + Math.random() * 8) + 'px';
    c.appendChild(p);
  }
  setTimeout(() => c.classList.add('hidden'), 4000);
}

function goHome() {
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('gameArea').classList.add('hidden');
  document.getElementById('historyScreen').classList.add('hidden');
  document.getElementById('wrongBookScreen').classList.add('hidden');
  document.getElementById('modeScreen').classList.remove('hidden');
  clearInterval(timerInterval);
}

initScene();
updateDiffHint();
</script>
